name: Update Nuclear Daily Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "29,59 * * * *"

permissions:
  contents: write

concurrency:
  group: nuclear-daily-brief-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news and build page
        env:
          SKIP_BACKFILL: "1"
        run: python collect_news.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html article_state.json news_archive.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update nuclear daily brief"
          git pull --rebase origin main
          git push origin main
