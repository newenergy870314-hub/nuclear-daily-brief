name: Update Nuclear Daily Brief

concurrency:
  group: nuclear-daily-brief
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect news and build page
        run: python collect_news.py
      - name: Commit updated page and article state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html article_state.json news_archive.json
          git diff --cached --quiet || git commit -m "Update nuclear daily brief"
          git push
