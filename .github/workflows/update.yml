name: Update Nuclear Daily Brief

concurrency:
  group: nuclear-daily-brief-update
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news and build page
        env:
          SKIP_BACKFILL: "0"
        run: python collect_news.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clean runner에서 생성/수정/삭제된 결과물을 모두 안전하게 stage
          # assets/thumbnails 폴더가 없어도 오류가 발생하지 않음
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update nuclear daily brief"
          git pull --rebase origin main
          git push origin main
