name: Update Nuclear Daily Brief

concurrency:
  group: nuclear-daily-brief-update
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news and build page
        env:
          # 30분 예약 실행에서는 과거 기사 Backfill을 생략해 실행 시간을 줄임.
          # Actions 화면에서 수동 실행할 때는 Backfill을 허용.
          SKIP_BACKFILL: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python collect_news.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html article_state.json news_archive.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update nuclear daily brief"

          # 실행 중 원격 저장소가 변경됐을 경우 최신 변경사항을 먼저 반영
          git pull --rebase origin main
          git push origin main
